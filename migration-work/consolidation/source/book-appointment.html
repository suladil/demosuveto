<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Book an Appointment | Paws &amp; Partners Veterinary Group</title>
  <meta name="description" content="Book a visit at any Paws &amp; Partners hospital in a few minutes. Choose a visit type, pick a time at Riverside, Old Town, Lakeview or Northgate, and review your booking.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Source page for /book-appointment. The pp-booking section becomes the Booking block:
    the image shows in the summary column and the intro sits above the booking steps.
    The steps, hospitals and sample openings are built by blocks/booking/booking.js,
    following the booking prototype supplied for this page. Nothing is sent or saved.
    Photo: Unsplash (free to use under the Unsplash License).
  -->
</head>
<body>
  <main>
    <section class="pp-booking">
      <div class="pp-booking-media">
        <img src="https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=1200&amp;q=75&amp;fm=jpg&amp;fit=crop" alt="Terrier with perked ears looking at the camera">
      </div>
      <div class="pp-booking-intro">
        <p class="pp-eyebrow">Book an appointment</p>
        <h1>Good care starts <em>with a good visit.</em></h1>
        <p>Find a time that works for you and your pet at any of our four hospitals. It only takes a few minutes.</p>
      </div>
    </section>
  </main>
</body>
</html>
